# Publishes the site to GitHub Pages on every push to main.
# Builds the language versions (/ru/ /ro/ /uk/), sitemap and robots.txt with tools/build.py.
# One-time setup on GitHub: Settings -> Pages -> Source: "GitHub Actions".
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

# The build job can only read the code; only the deploy job may publish.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the browser used for translating pages
        run: |
          pip install "playwright==1.63.0"
          python -m playwright install --with-deps chromium
      - name: Build
        env:
          # the public address of the site (custom domain enigmastudioo.com, bought on Cloudflare)
          SITE_URL: https://enigmastudioo.com/
        run: python tools/build.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
